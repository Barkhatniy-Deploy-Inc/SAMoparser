services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sam}
      POSTGRES_DB: ${POSTGRES_DB:-sam}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    image: ${BACKEND_IMAGE:-sam-backend:dev}
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      REDIS_URL: redis://redis:6379/0
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-sam}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sam}
      DB_NAME: ${POSTGRES_DB:-sam}
    ports:
      - "8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  ingest:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    image: ${BACKEND_IMAGE:-sam-backend:dev}
    command: ["uvicorn", "app.ingest:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      REDIS_URL: redis://redis:6379/0
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-sam}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sam}
      DB_NAME: ${POSTGRES_DB:-sam}
    ports:
      - "8001:8001"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  worker:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    image: ${BACKEND_IMAGE:-sam-backend:dev}
    command: ["celery", "-A", "app.worker", "worker", "-l", "info"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      REDIS_URL: redis://redis:6379/0
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-sam}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sam}
      DB_NAME: ${POSTGRES_DB:-sam}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  migrate:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    image: ${BACKEND_IMAGE:-sam-backend:dev}
    command: ["sh", "-lc", "cd /app/services/backend && alembic -c alembic.ini upgrade head"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-sam}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sam}
      DB_NAME: ${POSTGRES_DB:-sam}
    depends_on:
      postgres: {condition: service_healthy}

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    image: ${WEB_IMAGE:-sam-web:dev}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on: [api, ingest]

volumes:
  postgres-data:
