global:
  backendImage:
    repository: ghcr.io/example/sam-backend
    tag: dev
  webImage:
    repository: ghcr.io/example/sam-web
    tag: dev

serviceAccount:
  create: true

services:
  api:
    replicaCount: 1
  ingest:
    replicaCount: 1
  worker:
    replicaCount: 1
  web:
    replicaCount: 1

resources: {}
ingress:
  enabled: false
