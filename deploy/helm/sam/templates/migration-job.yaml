{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sam.fullname" . }}-migration
  labels:
    {{- include "sam.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "sam.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "sam.serviceAccountName" . }}
      containers:
        - name: migration
          image: {{ printf "%s:%s" .Values.global.backendImage.repository (.Values.global.backendImage.tag | toString) | quote }}
          command:
            {{- required "migrations.command is required when migrations.enabled" .Values.migrations.command | toYaml | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "sam.fullname" . }}-config
          env:
            {{- include "sam.secretEnv" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}
