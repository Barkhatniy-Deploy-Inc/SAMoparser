name: Main images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build and publish (defaults to commit SHA)
        required: false
        type: string

permissions:
  contents: read

jobs:
  images:
    name: Build and publish images
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ vars.VK_REGISTRY }}
      NAMESPACE: ${{ vars.VK_IMAGE_NAMESPACE }}
      REGISTRY_USERNAME: ${{ secrets.VK_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.VK_REGISTRY_PASSWORD }}
      TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify registry configuration
        if: ${{ env.REGISTRY == '' || env.NAMESPACE == '' || env.REGISTRY_USERNAME == '' || env.REGISTRY_PASSWORD == '' }}
        run: |
          echo 'Set VK_REGISTRY and VK_IMAGE_NAMESPACE variables plus VK_REGISTRY_USERNAME/VK_REGISTRY_PASSWORD secrets before publishing images.'
          exit 1
      - name: Log in to VK registry
        if: ${{ env.REGISTRY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Build and push backend
        if: ${{ env.REGISTRY != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/backend:${{ env.TAG }}
      - name: Build and push web
        if: ${{ env.REGISTRY != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/web:${{ env.TAG }}
      - name: Report missing registry configuration
        if: ${{ env.REGISTRY == '' }}
        run: echo 'Set VK_REGISTRY and VK_IMAGE_NAMESPACE repository variables plus registry credentials before publishing images.'
