name: Release images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  images:
    name: Build and publish semver images
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ vars.VK_REGISTRY }}
      NAMESPACE: ${{ vars.VK_IMAGE_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and derive semver tags
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $RELEASE_TAG is not a valid v* semver tag"
            exit 1
          fi
          core="${version%%[-+]*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${core%%.*}" >> "$GITHUB_OUTPUT"
          echo "minor=${core%.*}" >> "$GITHUB_OUTPUT"
      - name: Verify registry configuration
        if: ${{ env.REGISTRY == '' || vars.VK_IMAGE_NAMESPACE == '' }}
        run: |
          echo 'Set VK_REGISTRY and VK_IMAGE_NAMESPACE repository variables before publishing releases.'
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.VK_REGISTRY_USERNAME }}
          password: ${{ secrets.VK_REGISTRY_PASSWORD }}
      - name: Build and push backend semver tags
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/backend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/backend:${{ steps.version.outputs.major }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/backend:${{ steps.version.outputs.minor }}
      - name: Build and push web semver tags
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/web:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/web:${{ steps.version.outputs.major }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/web:${{ steps.version.outputs.minor }}
