name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (for example a release semver)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment:
      name: prod
    env:
      CHART_PATH: ${{ vars.HELM_CHART_PATH || 'deploy/helm/sam' }}
      RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME || 'samoparser' }}
      NAMESPACE: ${{ vars.HELM_NAMESPACE || 'prod' }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Configure Kubernetes access
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/kube"
          echo "$KUBECONFIG_BASE64" | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      - name: Deploy with Helm
        run: |
          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$NAMESPACE" --create-namespace \
            -f "$CHART_PATH/values-prod.yaml" \
            --set global.backendImage.tag="$IMAGE_TAG" \
            --set global.webImage.tag="$IMAGE_TAG" \
            --set existingSecret="${{ vars.HELM_EXISTING_SECRET }}" \
            --atomic --wait
