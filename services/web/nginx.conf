server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /api/ {
        proxy_pass http://api:8000;
    }

    location /ingest/ {
        proxy_pass http://ingest:8001;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
